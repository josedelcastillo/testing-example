name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  # Etapa 1 de la pirámide: rápidas, sin dependencias externas.
  unit-tests:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas unitarias (quality gate de cobertura >= 90 %)
        run: >
          pytest tests/unit
          --cov=app.pricing --cov=app.services --cov-fail-under=90
          --cov-report=term-missing
          --junitxml=reports/unit-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report-${{ matrix.python-version }}
          path: reports/

  # Etapa 2: solo corre si las unitarias pasaron (fail fast).
  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tienda
          POSTGRES_PASSWORD: tienda
          POSTGRES_DB: tienda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tienda"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://tienda:tienda@localhost:5432/tienda
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas de integración contra PostgreSQL
        run: >
          pytest tests/integration -m integration
          --cov=app --cov-fail-under=80
          --cov-report=term-missing --cov-report=xml:reports/coverage.xml
          --junitxml=reports/integration.xml
      - name: Resumen de cobertura
        if: always()
        run: |
          echo '### Cobertura (integración)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          coverage report >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: reports/
