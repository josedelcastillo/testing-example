# Pruebas end-to-end con Playwright (navegador real).
# Pipeline independiente del CI: se puede ejecutar contra la app desplegada
# localmente en el runner o contra cualquier ambiente (QA, staging).
name: E2E Tests (Playwright)

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/e2e/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker/**"
      - "requirements*.txt"
      - ".github/workflows/e2e-tests.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/e2e/**"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker/**"
      - "requirements*.txt"
      - ".github/workflows/e2e-tests.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL del ambiente a probar (vacío = desplegar la app en el runner)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * *" # regresión diaria, 01:00 hora de Perú

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  # Se pasa por variable de entorno, nunca interpolado en el script (evita inyección).
  E2E_BASE_URL: ${{ inputs.base_url || 'http://localhost:8000' }}
  DEPLOY_LOCAL: ${{ inputs.base_url == '' || inputs.base_url == null }}

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Desplegar app + PostgreSQL
        if: env.DEPLOY_LOCAL == 'true'
        run: docker compose up -d --build --wait
      - name: Pruebas E2E (Playwright)
        run: >
          pytest tests/e2e -m e2e
          --tracing retain-on-failure --screenshot only-on-failure
          --output reports/e2e-artifacts --junitxml=reports/e2e.xml
      - name: Logs de la app (si falló)
        if: failure() && env.DEPLOY_LOCAL == 'true'
        run: docker compose logs app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/
      - name: Apagar entorno
        if: always() && env.DEPLOY_LOCAL == 'true'
        run: docker compose down -v
