# Mismo flujo que .github/workflows/ci.yml, para Azure DevOps.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-latest

variables:
  PYTHON_VERSION: "3.12"

stages:
  - stage: Lint
    jobs:
      - job: ruff
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: pip install -r requirements-dev.txt
            displayName: Instalar dependencias
          - script: |
              ruff check .
              ruff format --check .
            displayName: Lint y formato

  - stage: UnitTests
    dependsOn: Lint
    jobs:
      - job: pytest_unit
        strategy:
          matrix:
            py311: { PY: "3.11" }
            py312: { PY: "3.12" }
            py313: { PY: "3.13" }
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PY)
          - script: pip install -r requirements-dev.txt
            displayName: Instalar dependencias
          - script: >
              pytest tests/unit
              --cov=app.pricing --cov=app.services --cov-fail-under=90
              --cov-report=term-missing --junitxml=reports/unit.xml
            displayName: Pruebas unitarias
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: reports/unit.xml
              testRunTitle: Unit $(PY)

  - stage: IntegrationTests
    dependsOn: UnitTests
    jobs:
      - job: pytest_integration
        variables:
          TEST_DATABASE_URL: postgresql+psycopg://tienda:tienda@localhost:5432/tienda_test
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: docker compose up -d --wait db
            displayName: Levantar PostgreSQL
          - script: pip install -r requirements-dev.txt
            displayName: Instalar dependencias
          - script: >
              pytest tests/integration -m integration
              --cov=app --cov-fail-under=80
              --cov-report=xml:reports/coverage.xml
              --junitxml=reports/integration.xml
            displayName: Pruebas de integración
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: reports/integration.xml
              testRunTitle: Integration
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: reports/coverage.xml
          - script: docker compose down -v
            condition: always()
            displayName: Apagar PostgreSQL

  - stage: ApiTests
    displayName: API Tests (Karate)
    dependsOn: IntegrationTests
    jobs:
      - job: karate
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: "21"
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - script: docker compose up -d --build --wait
            displayName: Desplegar app + PostgreSQL
          - script: mvn -B test -Dkarate.baseUrl=http://localhost:8000
            workingDirectory: tests/karate
            displayName: Pruebas de API (Karate)
          - script: docker compose logs app
            condition: failed()
            displayName: Logs de la app
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: tests/karate/target/karate-reports/*.xml
              testRunTitle: API (Karate)
          - publish: tests/karate/target/karate-reports
            artifact: karate-report
            condition: succeededOrFailed()
          - script: docker compose down -v
            condition: always()
            displayName: Apagar entorno

  # Corre en paralelo con ApiTests: ambas dependen solo de IntegrationTests.
  - stage: E2ETests
    dependsOn: IntegrationTests
    jobs:
      - job: playwright
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(PYTHON_VERSION)
          - script: |
              pip install -r requirements-dev.txt
              playwright install --with-deps chromium
            displayName: Instalar dependencias y navegador
          - script: docker compose up -d --build --wait
            displayName: Desplegar app + PostgreSQL
          - script: >
              pytest tests/e2e -m e2e
              --tracing retain-on-failure --screenshot only-on-failure
              --output reports/e2e-artifacts --junitxml=reports/e2e.xml
            displayName: Pruebas E2E (Playwright)
          - script: docker compose logs app
            condition: failed()
            displayName: Logs de la app
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: reports/e2e.xml
              testRunTitle: E2E
          - publish: reports/e2e-artifacts
            artifact: e2e-traces
            condition: failed()
          - script: docker compose down -v
            condition: always()
            displayName: Apagar entorno
